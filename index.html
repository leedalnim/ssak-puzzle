<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f6efdf" />
<title>슥삭퍼즐</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="슥삭퍼즐" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 게임 화면 (캔버스 + 오버레이 UI가 같은 박스를 공유) -->
    <div id="stage">
      <canvas id="game"></canvas>

      <!-- 상단 HUD: 좌측 앵커(시간) / 우측 앵커(남은 칸 + 일시정지) -->
      <header id="hud" class="hidden">
        <div class="hud-left">
          <div class="panel panel-time"><span id="hudTimer">0:00</span></div>
        </div>
        <div class="hud-right">
          <div class="panel panel-tiles"><span id="hudTiles">0</span></div>
          <button id="btnPause" class="icon-btn btn-pause" aria-label="일시정지"></button>
        </div>
      </header>

      <!-- 하단 바: 좌측 도움말 / 중앙 되돌리기 / 우측 다시하기 -->
      <div id="toolbar" class="hidden">
        <div class="tool"><button id="btnHelp" class="icon-btn btn-help" aria-label="도움말"></button><span>도움말</span></div>
        <div class="tool"><button id="btnUndo" class="pill-btn btn-undo" aria-label="되돌리기"></button><span>되돌리기</span></div>
        <div class="tool"><button id="btnRestart" class="icon-btn btn-restart" aria-label="다시하기"></button><span>다시하기</span></div>
      </div>

      <div id="progressWrap" class="hidden"><div id="progressBar"></div></div>
    </div>

    <!-- 타이틀 -->
    <section id="screenTitle" class="screen art-screen">
      <div class="title-art">
        <h1 class="logo"><img src="assets/room/screens/logo.webp" alt="슥삭퍼즐" /></h1>
        <p class="tagline">무기력한 방 한 칸에서, 다시 세상 밖으로</p>
      </div>
      <div class="screen-actions">
        <button id="btnStart" class="big-btn">시작하기</button>
        <button id="btnStages" class="ghost-btn">스테이지 선택</button>
      </div>
      <div class="rating">전체 이용가</div>
    </section>

    <!-- 스테이지 선택 -->
    <section id="screenStages" class="screen hidden">
      <h2 class="screen-title">스테이지</h2>
      <div id="stageGrid" class="stage-grid"></div>
      <button id="btnStagesBack" class="ghost-btn">뒤로</button>
    </section>

    <!-- 인트로 -->
    <section id="screenIntro" class="screen art-screen hidden">
      <div class="intro-copy">
        <p class="act-badge" id="introAct"></p>
        <h2 class="intro-title" id="introTitle"></h2>
        <p id="introText" class="intro-text"></p>
        <button id="btnIntroNext" class="big-btn">계속</button>
      </div>
    </section>

    <!-- 클리어 -->
    <section id="screenClear" class="screen modal hidden">
      <div class="modal-card">
        <div class="clear-emoji">✨</div>
        <h2 id="clearTitle">깨끗해졌다!</h2>
        <p id="clearStory" class="clear-story"></p>
        <div class="clear-stats"><span id="clearTime"></span><span id="clearUnlock"></span></div>
        <button id="btnNext" class="big-btn">다음 스테이지</button>
        <button class="ghost-btn" data-back>스테이지 목록</button>
      </div>
    </section>

    <!-- 실패 -->
    <section id="screenFail" class="screen modal hidden">
      <div class="modal-card">
        <div class="clear-emoji">😵‍💫</div>
        <h2 id="failTitle">아직이야…</h2>
        <p id="failReason" class="clear-story"></p>
        <button id="btnRetry" class="big-btn">다시 하기</button>
        <button id="btnUndoFromFail" class="ghost-btn">↩ 한 수 무르기</button>
      </div>
    </section>

    <!-- 도움말(가이드) -->
    <section id="screenHelp" class="screen modal hidden">
      <div class="modal-card help-card">
        <h2>어떻게 하나요?</h2>
        <p class="help-lead">캐릭터를 움직여 <b>모든 칸을 깨끗하게</b> 만들면 클리어!</p>
        <ul class="help-rules">
          <li>지나간 칸은 한 단계씩 닦여요.</li>
          <li>이미 깨끗해진 칸은 <b>다시 지나갈 수 없어요.</b></li>
          <li>더러울수록 여러 번 지나가야 해요.</li>
        </ul>
        <div class="legend" id="legend"></div>
        <button id="btnHelpClose" class="big-btn">알겠어요</button>
      </div>
    </section>

    <!-- 일시정지 -->
    <section id="screenPause" class="screen modal hidden">
      <div class="modal-card">
        <h2>잠깐 쉬는 중</h2>
        <button id="btnResume" class="big-btn">이어하기</button>
        <button id="btnPauseRestart" class="ghost-btn">처음부터</button>
        <button class="ghost-btn" data-back>스테이지 목록</button>
      </div>
    </section>

    <section id="screenLoad" class="screen">
      <div class="loader">슥… 삭…</div>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
