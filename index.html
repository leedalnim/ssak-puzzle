<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="theme-color" content="#f6efdf" />
<title>쓱싹퍼즐</title>
<link rel="icon" href="favicon.ico" sizes="any" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="쓱싹퍼즐" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <!-- 게임 화면 (캔버스 + 오버레이 UI가 같은 박스를 공유) -->
    <div id="stage">
      <canvas id="game"></canvas>

      <!-- 상단 HUD: 좌측 앵커(시간) / 우측 앵커(남은 칸 + 일시정지) -->
      <header id="hud" class="hidden">
        <div class="hud-left">
          <div class="panel panel-time"><span id="hudTimer">0:00</span></div>
        </div>
        <div class="hud-right">
          <div class="hud-item hidden" id="hudItem"><img src="" alt=""></div>
          <div class="panel panel-tiles"><span id="hudTiles">0</span></div>
          <button id="btnPause" class="icon-btn btn-pause" aria-label="일시정지"></button>
        </div>
      </header>

      <!-- 하단 바: 좌측 도움말 / 중앙 되돌리기 / 우측 다시하기 -->
      <div id="toolbar" class="hidden">
        <div class="tool"><button id="btnHelp" class="icon-btn btn-help" aria-label="도움말"></button><span>도움말</span></div>
        <div class="tool"><button id="btnUndo" class="pill-btn btn-undo" aria-label="되돌리기"></button><span>되돌리기</span></div>
        <div class="tool"><button id="btnRestart" class="icon-btn btn-restart" aria-label="다시하기"></button><span>다시하기</span></div>
      </div>

      <!-- 주운 물건이 상단 수집 표시로 날아가는 연출 -->
      <img id="flyItem" class="fly-item hidden" src="" alt="">
    </div>

    <!-- 타이틀 -->
    <section id="screenTitle" class="screen art-screen">
      <div class="title-art">
        <p class="tagline">무기력한 방 한 칸에서, 다시 세상 밖으로</p>
        <h1 class="logo"><img src="assets/room/screens/logo.webp" alt="쓱싹퍼즐" /></h1>
      </div>
      <div class="screen-actions">
        <button id="btnStart" class="big-btn">시작하기</button>
        <button id="btnStages" class="ghost-btn">스테이지 선택</button>
        <div class="title-subnav">
          <div class="sn-item">
            <button id="btnCollection" class="sn-btn" aria-label="수집함">
              <img src="assets/room/ui/kit/ic_basket.png" alt="">
              <span class="sn-badge hidden" id="badgeCollection"></span>
            </button><span>수집함</span>
          </div>
          <div class="sn-item">
            <button id="btnAchieve" class="sn-btn" aria-label="도전과제">
              <img src="assets/room/ui/kit/ic_trophy.png" alt="">
              <span class="sn-badge hidden" id="badgeAchieve"></span>
            </button><span>도전과제</span>
          </div>
        </div>
      </div>
      <div class="rating">전체 이용가</div>
    </section>

    <!-- 스테이지 선택 -->
    <section id="screenStages" class="screen hidden stage-screen">
      <div class="stage-head">
        <button id="btnStagesBack" class="stage-back" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="title-pill">스테이지</div>
      </div>
      <div class="area-viewport"><div class="area-track" id="areaTrack"></div></div>
      <div class="pager">
        <button class="pg-arrow" id="pgPrev" aria-label="이전">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="pg-dots" id="pgDots"></div>
        <button class="pg-arrow" id="pgNext" aria-label="다음">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>
        </button>
      </div>
    </section>

    <!-- 수집함 -->
    <section id="screenCollection" class="screen hidden panel-screen">
      <div class="stage-head">
        <button id="btnCollBack" class="stage-back" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="title-pill">수집함</div>
      </div>
      <div class="coll-tabs" id="collTabs"></div>
      <div class="big-panel">
        <div class="panel-count" id="collCount">0 / 12</div>
        <div class="slot-grid" id="collGrid"></div>
      </div>
      <!-- 고양이가 말풍선으로 물건 이야기를 해준다 -->
      <div class="cat-talk">
        <div class="bubble" id="itemInfo">
          <b id="itemName">물건을 눌러보세요</b><span id="itemDesc">모은 물건의 이야기를 볼 수 있어요.</span>
        </div>
        <img class="talk-cat" src="assets/room/ui/kit/cat_sit.png" alt="">
      </div>
    </section>

    <!-- 도전과제 -->
    <section id="screenAchieve" class="screen hidden panel-screen">
      <div class="stage-head">
        <button id="btnAchBack" class="stage-back" aria-label="뒤로">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>
        </button>
        <div class="title-pill">도전과제</div>
      </div>
      <div class="big-panel"><div class="ach-list" id="achList"></div></div>
    </section>

    <!-- 인트로 -->
    <section id="screenIntro" class="screen art-screen hidden">
      <div class="intro-copy">
        <h2 class="intro-title" id="introTitle"></h2>
        <p id="introText" class="intro-text"></p>
        <button id="btnIntroNext" class="big-btn">계속</button>
      </div>
    </section>

    <!-- 클리어 -->
    <section id="screenClear" class="screen modal hidden">
      <div class="clear-card">
        <h2 id="clearTitle" class="clear-title">클리어!</h2>
        <div class="clear-stars" id="clearStars">
          <img src="assets/room/ui/clear/gold-star-single.png" alt="">
          <img src="assets/room/ui/clear/gold-star-single.png" alt="">
          <img src="assets/room/ui/clear/gold-star-single.png" alt="">
        </div>
        <div class="clear-hero">
          <span class="fig fig-cat"><img src="assets/room/ui/clear/tuxedo-cat-sitting.png" alt=""></span>
          <span class="fig fig-girl"><img src="assets/room/ui/clear/girl-celebration-with-mop.png" alt=""></span>
        </div>
        <p id="clearStory" class="clear-story"></p>
        <div class="reward hidden" id="clearReward">
          <div class="rw-slot"><img id="rewardImg" src="" alt=""></div>
          <div class="rw-txt"><b id="rewardName"></b><span>수집함에 담겼어요</span></div>
        </div>
        <div class="clear-actions">
          <button id="btnRetryClear" class="circ-btn" aria-label="다시 하기"></button>
          <button id="btnNext" class="big-btn next-pill">다음 스테이지</button>
        </div>
        <button class="ghost-btn clear-list" data-back>스테이지 목록</button>
      </div>
    </section>

    <!-- 실패 -->
    <section id="screenFail" class="screen modal hidden">
      <div class="clear-card">
        <h2 id="failTitle" class="clear-title">아직이야…</h2>
        <div class="clear-hero fail-hero">
          <span class="fig fig-cat"><img src="assets/room/ui/fail/cat.png" alt=""></span>
          <span class="fig fig-girl"><img src="assets/room/ui/fail/girl.png" alt=""></span>
        </div>
        <p id="failReason" class="clear-story"></p>
        <button id="btnRetry" class="big-btn with-icon">
          <img class="btn-ico" src="assets/room/ui/btn/icon_restart.png" alt=""><span>다시 하기</span>
        </button>
        <div class="fail-subs">
          <button class="ghost-btn" data-back>스테이지 목록</button>
        </div>
      </div>
    </section>

    <!-- 도움말(가이드) -->
    <section id="screenHelp" class="screen modal hidden">
      <div class="modal-card help-card">
        <h2>어떻게 하나요?</h2>
        <p class="help-lead">캐릭터를 움직여 <b>모든 칸을 깨끗하게</b> 만들면 클리어!</p>
        <ul class="help-rules">
          <li>지나간 칸은 한 단계씩 닦여요.</li>
          <li>이미 깨끗해진 칸은 <b>다시 지나갈 수 없어요.</b></li>
          <li>더러울수록 여러 번 지나가야 해요.</li>
        </ul>
        <div class="legend" id="legend"></div>
        <button id="btnHelpClose" class="big-btn">알겠어요</button>
      </div>
    </section>

    <!-- 일시정지 -->
    <section id="screenPause" class="screen modal hidden">
      <div class="modal-card">
        <h2>잠깐 쉬는 중</h2>
        <button id="btnResume" class="big-btn">이어하기</button>
        <button id="btnPauseRestart" class="ghost-btn">처음부터</button>
        <button class="ghost-btn" data-back>스테이지 목록</button>
      </div>
    </section>

    <section id="screenLoad" class="screen">
      <div class="loader">쓱… 싹…</div>
    </section>
  </div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
